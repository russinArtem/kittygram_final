name: Main Kittygram workflow

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          load: true
          tags: backend:test

      - name: Build frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          load: true
          tags: frontend:test

      - name: Build gateway (nginx) image
        uses: docker/build-push-action@v4
        with:
          context: ./nginx
          load: true
          tags: gateway:test

      - name: Create Docker network
        run: docker network create kittygram-net || true

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name db \
            --network kittygram-net \
            -e POSTGRES_USER=django_user \
            -e POSTGRES_PASSWORD=PASSWORD \
            -e POSTGRES_DB=django_db \
            -p 5432:5432 \
            postgres:13

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if docker exec db pg_isready -U django_user -d django_db > /dev/null 2>&1; then
              break
            fi
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Start backend service
        run: |
          docker run -d \
            --name backend \
            --network kittygram-net \
            -e DB_HOST=db \
            -e DB_PORT=5432 \
            -e POSTGRES_USER=django_user \
            -e POSTGRES_PASSWORD=PASSWORD \
            -e POSTGRES_DB=django_db \
            -p 8000:8000 \
            backend:test

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8000/health/ > /dev/null 2>&1; then
              break
            fi
            echo "Waiting for backend..."
            sleep 2
          done || true

      - name: Start frontend service
        run: |
          docker run -d \
            --name frontend \
            --network kittygram-net \
            frontend:test \
            sh -c "cp -r /app/build/. /frontend_static/"

      - name: Start gateway service
        run: |
          docker run -d \
            --name gateway \
            --network kittygram-net \
            -e BACKEND_HOST=backend \
            -e BACKEND_PORT=8000 \
            -e STATIC_DIR=/staticfiles \
            -e MEDIA_DIR=/media \
            -p 9000:80 \
            gateway:test

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install flake8==7.3.0 flake8-isort==7.0.0
          pip install -r ./backend/requirements.txt

      - name: Test with flake8 and pytests
        env:
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: <PASSWORD>
          POSTGRES_DB: django_db
          DB_HOST: db
          DB_PORT: 5432
        run: |
          python -m flake8 backend/
          pytest

      - name: Clean up Docker containers
        if: always()
        run: |
          docker stop db backend frontend gateway || true
          docker rm -f db backend frontend gateway || true
          docker network rm kittygram-net || true
  build_and_push_to_docker_hub:
    name: Push Docker image to DockerHub
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker 
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }} 
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./backend/
          push: true
          tags: artemrussin/kittygram_backend:latest
  frontend_tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up nodeJS
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install dependencies
      run: |
        cd frontend/
        npm ci

    - name: Test frontend
      run: |
        cd frontend/
        npm run test
  build_frontend_and_push_to_docker_hub:
    name: Push frontend Docker image to DockerHub
    runs-on: ubuntu-latest
    needs: frontend_tests
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker 
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./frontend/
          push: true
          tags: artemrussin/kittygram_frontend:latest
  build_gateway_and_push_to_docker_hub:
    name: Push gateway Docker image to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker 
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./nginx/
          push: true
          tags: artemrussin/kittygram_gateway:latest
  deploy:
    runs-on: ubuntu-latest
    needs: 
      - build_and_push_to_docker_hub
      - build_frontend_and_push_to_docker_hub
      - build_gateway_and_push_to_docker_hub
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Copy docker-compose.yml via ssh
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.production.yml"
          target: "kittygram"
      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd kittygram
            sudo docker compose -f docker-compose.production.yml pull
            sudo docker compose -f docker-compose.production.yml down
            sudo docker compose -f docker-compose.production.yml up -d
            sudo docker compose -f docker-compose.production.yml exec backend python manage.py migrate
            sudo docker compose -f docker-compose.production.yml exec backend python manage.py collectstatic
            sudo docker compose -f docker-compose.production.yml exec backend cp -r /app/collected_static/. /backend_static/static/
  send_message:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
    - name: Send message
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: Деплой проекта Kittygram успешно выполнен!